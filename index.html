<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>火山预警</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E🌋%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🌋</span>
          <div>
            <h1>火山地图</h1>
            <p id="meta" class="meta">加载中…</p>
          </div>
        </div>
        <button id="btn-fit" type="button" class="btn">适应视野</button>
      </header>
      <div id="filters" class="filters" role="tablist" aria-label="显示范围">
        <button type="button" class="filter-btn active" data-filter="alerts" role="tab">仅预警</button>
        <button type="button" class="filter-btn" data-filter="active" role="tab">活跃+休眠</button>
        <button type="button" class="filter-btn" data-filter="all" role="tab">全部</button>
      </div>
      <div id="map" aria-label="火山地图"></div>
      <div id="legend" class="legend" aria-label="图例">
        <span><i class="dot red"></i>红警</span>
        <span><i class="dot orange"></i>橙</span>
        <span><i class="dot yellow"></i>黄</span>
        <span><i class="dot active"></i>活跃</span>
        <span><i class="dot dormant"></i>休眠</span>
      </div>
      <div id="status" class="status" hidden></div>
      <aside id="sheet" class="sheet" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-body">
          <div class="sheet-head">
            <span id="sheet-level" class="badge"></span>
            <h2 id="sheet-title"></h2>
          </div>
          <p id="sheet-summary" class="sheet-summary"></p>
          <p id="sheet-meta" class="sheet-meta"></p>
          <div class="sheet-actions">
            <a id="sheet-link" class="btn primary" href="#" target="_blank" rel="noopener">查看原文</a>
            <button id="btn-close" type="button" class="btn">关闭</button>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
